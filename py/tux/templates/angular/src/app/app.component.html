<nav data-tux-component="MainNav">
  <a href="/" (click)="navigate('/', $event)">Home</a>
  <a href="/products" (click)="navigate('/products', $event)">Products</a>
  <a href="/checkout" (click)="navigate('/checkout', $event)">Checkout</a>
</nav>
<main>
  @if (route === '/products') {
    <h1>Products</h1>
    <div data-tux-component="ProductTabs" [attr.data-tux-state-tab]="tab">
      <div role="tablist">
        @for (t of tabs; track t) {
          <button role="tab" [attr.aria-selected]="tab === t" [attr.data-tab]="t" (click)="tab = t">{{ t }}</button>
        }
      </div>
      <ul data-tux-component="ProductList" [style.display]="tab === 'featured' ? 'none' : ''">
        @for (p of products; track p.id) {
          <li data-tux-component="ProductCard" [attr.data-tux-instance]="p.id">
            <span [attr.data-tux-id]="'product-name-' + p.id">{{ p.name }}</span>
            <span [attr.data-tux-id]="'product-price-' + p.id" data-tux-component="PriceLabel">{{ p.price }}</span>
          </li>
        }
      </ul>
    </div>
  } @else if (route === '/checkout') {
    <h1>Checkout</h1>
    <div data-tux-component="CheckoutActions">
      <button data-tux-id="coupon-open" (click)="modalOpen = true">Add coupon</button>
      <button data-tux-id="checkout-submit" data-tux-component="SubmitButton">Complete purchase</button>
    </div>
    @if (modalOpen) {
      <div role="dialog" aria-modal="true" aria-label="Coupon" data-tux-component="CouponModal">
        <p>Add a coupon code.</p>
        <input data-tux-id="coupon-input" placeholder="Code" />
        <button data-tux-id="coupon-apply" (click)="modalOpen = false">Apply</button>
      </div>
    }
  } @else {
    <h1>Home</h1>
  }
</main>
