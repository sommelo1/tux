[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tux-uix"
version = "0.1.0"
description = "TUX - TUX UIX review system: attach structured, machine-readable feedback directly to running web UIs (pages, routes, components, elements, states) with a deterministic CLI, canonical JSON and LLM-friendly skills."
readme = "README.md"
license = "MIT"
authors = [
  { name = "Lorenz Sommer", email = "59441867+sommelo1@users.noreply.github.com" },
]
requires-python = ">=3.10"
dependencies = []
keywords = ["ui", "ux", "review", "feedback", "clickable-design", "llm", "ai", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/sommelo1/tux"
Repository = "https://github.com/sommelo1/tux"
Issues = "https://github.com/sommelo1/tux/issues"

[project.scripts]
tux = "tux.cli:console_main"

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["tux*"]

[tool.setuptools.package-data]
tux = ["skills/*.md", "client/*.js", "client/*.css", "templates/**/*"]
