name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  js:
    name: JS tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Run JavaScript test suite
        run: npm test
        working-directory: js
      - name: Package + content inspection
        run: node tools/package-js.mjs

  python:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package (editable) + pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e py
          python -m pytest py/tests -q
      - name: Package + content inspection
        run: node tools/package-py.mjs

  install-test:
    name: Dedicated-environment install test (incl. vue/angular builds)
    runs-on: ubuntu-latest
    needs: [js, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build packages
        run: |
          node tools/package-js.mjs
          node tools/package-py.mjs
      - name: Install + verify in dedicated environments
        run: node tools/install-test.mjs
