name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Run JavaScript test suite
        run: npm test
        working-directory: js
      - name: Build and verify npm release artifacts
        run: node tools/package-js.mjs
      - name: Publish
        run: npm publish --provenance --access public
        working-directory: js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify npm release visibility
        run: |
          node -e "const {execFileSync}=require('node:child_process'); const fs=require('fs'); const v=JSON.parse(fs.readFileSync('js/package.json','utf8')).version; const out=execFileSync('npm',['view','tux-review','version'],{encoding:'utf8'}).trim(); if (out !== v) { console.error('expected ' + v + ', got ' + out); process.exit(1); }"

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run Python test suite
        run: |
          python -m pip install pytest
          python -m pip install -e py
          python -m pytest py/tests -q
      - name: Build and verify Python release artifacts
        run: node tools/package-py.mjs
      - name: Publish (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - name: Verify PyPI release visibility
        run: |
          python - <<'PY'
          import pathlib, re, sys, time, tomllib, urllib.request
          target = tomllib.loads((pathlib.Path("py") / "pyproject.toml").read_text())["project"]["version"]
          url = "https://pypi.org/simple/tux-review/"
          for _ in range(30):
              text = urllib.request.urlopen(url, timeout=20).read().decode()
              if re.search(rf"tux_review-{re.escape(target)}(?:-py3-none-any)?\.(?:whl|tar\.gz)", text):
                  sys.exit(0)
              time.sleep(10)
          raise SystemExit(f"PyPI simple index did not expose tux-review {target}")
          PY
